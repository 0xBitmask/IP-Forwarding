# IP Forwarding Configuration for Orange Pi Zero 3
# Modify these values to match your network setup

# Tailscale interface (usually tailscale0)
TAILSCALE_IF="tailscale0"

# Lab network interface (eth0 or wlan0, where your web server / Raspberry Pi lives)
# Leave empty for auto-detection (finds the interface with an IP in LAN_SUBNET)
LAN_IF=""

# Lab network subnet (e.g., 192.168.1.0/24)
# This is the network that contains your web server (Raspberry Pi)
LAN_SUBNET="192.168.1.0/24"

# Web server (Raspberry Pi) IP on the lab network that you want to reach
TARGET_SERVER="192.168.1.40"

# Log file path
LOG_FILE="/var/log/ip_forwarding.log"
